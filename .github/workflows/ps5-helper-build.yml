name: PS5 Helper Build

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ps5-helper-build.yml"
      - "helper/scripts/import_upstream.py"

jobs:
  helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang lld llvm unzip curl python3
      - name: Import pinned GPL helper source
        run: python3 helper/scripts/import_upstream.py
      - name: Install pinned PS5 Payload SDK and SQLite
        shell: bash
        run: |
          set -euo pipefail
          cd helper/upstream
          export PS5_SDK_INSTALL_DIR="$RUNNER_TEMP/ps5-payload-sdk"
          bash scripts/install-ps5-sdk.sh
          echo "PS5_PAYLOAD_SDK=$PS5_SDK_INSTALL_DIR" >> "$GITHUB_ENV"
      - name: Build PS5 helper ELF
        shell: bash
        run: |
          set -euo pipefail
          make -C helper/upstream/payload
          test -s helper/upstream/payload/ps5upload.elf
          cp helper/upstream/payload/ps5upload.elf helper/zerospace-helper.elf
      - name: Collect GPL source and notices
        shell: bash
        run: |
          mkdir -p helper-artifact/source
          cp helper/zerospace-helper.elf helper-artifact/
          cp helper/NOTICE.md helper/README.md helper-artifact/
          cp helper/upstream/LICENSE helper-artifact/
          cp helper/upstream/UPSTREAM_REVISION helper-artifact/
          cp -R helper/upstream/payload helper-artifact/source/
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroSpace-PS5-Helper
          path: helper-artifact/
          if-no-files-found: error
          retention-days: 7
