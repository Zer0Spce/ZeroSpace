name: Windows Build
# Portable milestone rebuild after Games TypeScript compile fix; installer deferred.

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Fetch UnRAR source
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o unrarsrc.tar.gz https://www.rarlab.com/rar/unrarsrc-7.3.1.tar.gz
          New-Item -ItemType Directory -Force engines/zsftp/unrarsrc | Out-Null
          tar -xzf unrarsrc.tar.gz -C engines/zsftp/unrarsrc --strip-components=1
          if (-not (Test-Path engines/zsftp/unrarsrc/rar.hpp)) { throw "UnRAR source extraction failed" }
      - name: Install libarchive
        shell: pwsh
        run: |
          vcpkg install libarchive:x64-windows-static
      - name: Build ZSFTP core
        shell: pwsh
        run: |
          cmake -S engines/zsftp -B engines/zsftp/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DRARFTP_BUILD_LIBRARY=ON -DRARFTP_BUILD_TESTS=OFF -DRARFTP_BUNDLED_CURL=ON
          cmake --build engines/zsftp/build --config Release
      - name: Build ZeroSpace portable app
        shell: pwsh
        run: |
          $lib = Resolve-Path "engines/zsftp/build/Release" -ErrorAction SilentlyContinue
          if (-not $lib) { $lib = Resolve-Path "engines/zsftp/build" }
          $env:ZSFTP_LIB_DIR = $lib.Path
          npm run tauri build
      - name: Collect Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          if (Test-Path src-tauri/target/release/zerospace.exe) { Copy-Item src-tauri/target/release/zerospace.exe artifact }
          Get-ChildItem engines/zsftp/build -Recurse -Filter zsftpcore.dll | Select-Object -First 1 | Copy-Item -Destination artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroSpace-Windows-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
