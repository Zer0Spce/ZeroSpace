[package]
name = "zsftp-gui"
version = "1.2.0"
description = "PS5 ZeroSpace FTP desktop app: streams RAR, ZIP and 7z archives over FTP without temporary extraction"
authors = ["Jeremie Patawaran"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "zsftp_gui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
